[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "why-fail"
version = "0.1.0"
description = "Cross-task memory methods and benchmark execution for Why Do Self-Improving Agents Fail?"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6",
    "openai==2.32.0",
    "anthropic==0.96.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2"]
appworld = ["appworld==0.1.3.post1", "jinja2>=3.1"]
tau2 = ["tau2 @ git+https://github.com/sierra-research/tau2-bench.git@0ed2fd8d830a20657d89ae9c2efcc94838aa7129"]
browsecomp = ["datasets>=2.14", "pyserini==1.6.0", "transformers>=4.45"]
swebench = ["swebench[datasets]==4.1.0", "datasets>=2.14", "pyserini==1.6.0", "tiktoken>=0.12", "modal>=1.4"]
terminalbench = ["harbor[modal]==0.4.0"]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["Methods", "Task", "runtime"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "runtime/configs"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["Methods/tests", "Task/test_tasks.py", "Task/tests", "tests"]
